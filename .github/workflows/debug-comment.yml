name: Debug Comment
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: create
        id: create
        run: |
          resp=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/1/comments \
            -d '{"body":"raw curl create test"}')
          echo "$resp"
          id=$(echo "$resp" | jq -r '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: update
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X PATCH -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/comments/${{ steps.create.outputs.id }} \
            -d '{"body":"raw curl update test"}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
